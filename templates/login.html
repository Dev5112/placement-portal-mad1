{% extends "base.html" %}

{% block title %}Login | Placement Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="glass-card animate-fade-in">
            <div class="glass-header text-center border-0 pb-2 pt-4">
                <h3 class="fw-bold mb-0" style="color: var(--primary);">Login</h3>
            </div>

            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-premium w-100 mt-2">
                            Login
                        </button>
                    </div>
                </form>
            </div>

            <div class="text-center pt-3 pb-4">
                <small>
                    New student?
                    <a href="{{ url_for('main.student_register') }}">Register here</a>
                    <br>
                    Company?
                    <a href="{{ url_for('main.company_register') }}">Register your company</a>
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
